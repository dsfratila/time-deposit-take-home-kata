openapi: 3.0.3
info:
  title: Time deposit API
  version: 1.0.0
paths:
  /time-deposits:
    get:
      operationId: listTimeDeposits
      summary: Retrieve all time deposits
      description: Returns stored balances without accruing interest. No pagination or filtering.
      responses:
        '200':
          description: All deposits in ascending ID order, or an empty array when none exist.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeDepositResponse'
  /time-deposits/interest-accruals:
    post:
      operationId: accrueInterest
      summary: Accrue monthly interest for all time deposits
      description: >-
        Synchronously applies the existing monthly interest rules to deposits selected
        at the start of the operation in sequential batches of at most 500 deposits.
        Each batch commits independently. If a batch fails, it rolls back, earlier
        batches remain committed, and later batches are skipped. Days and withdrawals
        are unchanged. Requests accrue again on stored balances, including retries
        after partial failure; there is no calendar-period tracking or deduplication.
        Deposits inserted after selection are processed by a subsequent request.
        No request body is required.
      responses:
        '204':
          description: All batches committed successfully, including for an empty database.
        '500':
          description: >-
            Interest accrual failed. The failing batch rolled back, earlier batches
            may already have committed, and later batches were not processed.
components:
  schemas:
    TimeDepositResponse:
      type: object
      additionalProperties: false
      required: [id, planType, balance, days, withdrawals]
      properties:
        id:
          type: integer
          format: int32
        planType:
          type: string
          description: Stored plan name, including unrecognized plan names.
          example: basic
        balance:
          type: number
          multipleOf: 0.01
        days:
          type: integer
          format: int32
        withdrawals:
          type: array
          description: Associated withdrawals in ascending ID order; empty when none exist.
          items:
            $ref: '#/components/schemas/WithdrawalResponse'
    WithdrawalResponse:
      type: object
      additionalProperties: false
      required: [id, amount, date]
      properties:
        id:
          type: integer
          format: int32
        amount:
          type: number
          multipleOf: 0.01
        date:
          type: string
          format: date
