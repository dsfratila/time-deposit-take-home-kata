services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: time_deposit
      POSTGRES_USER: time_deposit
      POSTGRES_PASSWORD: time_deposit
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U time_deposit -d time_deposit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
